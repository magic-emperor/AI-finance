name: Paper trade — US/crypto/etf Donchian

# Daily forward-paper-trading snapshot for the US/crypto/etf Donchian trial
# (registry.py hypothesis id=2, trial id=7 -- corrected plain-baseline
# measurement, DSR=0.9622, the strongest-supported hypothesis so far).
# Same design as paper_trade_fx_commodity.yml, including its two fixed bugs
# (separate per-file `git add`, .gitignore exception for this CSV) baked in
# from the start rather than repeating that discovery process.

on:
  schedule:
    - cron: "30 23 * * *"   # after all markets' daily candles close
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liquidity-core-v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: pip install -r engine/requirements.txt

      - name: Run paper-trading snapshot
        run: python -X utf8 -m engine.run_paper_us_crypto_etf

      - name: Commit and push updated state
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add engine/output/paper_state_us_crypto_etf.json 2>/dev/null || true
          git add engine/output/paper_equity_us_crypto_etf.csv 2>/dev/null || true
          git add engine/output/paper_us_crypto_etf_KILLED.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily paper-trading snapshot ($(date -u +%Y-%m-%d))"
            git push origin feat/liquidity-core-v2
          else
            echo "No state changes to commit."
          fi
