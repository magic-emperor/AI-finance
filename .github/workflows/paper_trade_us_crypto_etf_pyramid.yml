name: Paper trade — US/crypto/etf Donchian (pyramid exit)

# Daily forward-paper-trading snapshot for the pyramid-exit Donchian variant
# (registry.py hypothesis id=5, PBO=0.0635 -- a well-supported, not overfit,
# exit-variant selection). Third, independent paper track alongside the
# baseline US/crypto/etf and FX/commodity ones -- not a replacement for
# either, since all three are separately registered hypotheses.

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liquidity-core-v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: pip install -r engine/requirements.txt

      - name: Run paper-trading snapshot
        run: python -X utf8 -m engine.run_paper_us_crypto_etf_pyramid

      - name: Commit and push updated state
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add engine/output/paper_state_us_crypto_etf_pyramid.json 2>/dev/null || true
          git add engine/output/paper_equity_us_crypto_etf_pyramid.csv 2>/dev/null || true
          git add engine/output/paper_us_crypto_etf_pyramid_KILLED.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily paper-trading snapshot ($(date -u +%Y-%m-%d))"
            git push origin feat/liquidity-core-v2
          else
            echo "No state changes to commit."
          fi
