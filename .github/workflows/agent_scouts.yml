name: Agent scouts

# Deterministic watchers (no LLM, no cost): NSE filings, news, regulators, whole-market bhavcopy.
# Writes flags/state/run records to the `agent-data` branch and, when a flag group clears the
# escalation gate, wakes the prediction-agent routine via its API trigger.
# Never touches feat/liquidity-core-v2, main, or anything the paper-trading bots use.

on:
  schedule:
    - cron: "*/15 3-10 * * 1-5"        # every 15 min, 08:30-16:15 IST (NSE session + filings)
    - cron: "7 0-2,11-23 * * 1-5"      # hourly outside the session (FX, global news, regulators)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: agent-data-writer             # serialises with the grader; no push races on agent-data
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liquidity-core-v2

      - uses: actions/checkout@v4
        with:
          ref: agent-data
          path: _agent_data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: intel/requirements.txt

      - run: pip install -r intel/requirements.txt

      - id: scout
        run: python -X utf8 -m intel.scouts.run_scouts --data-dir _agent_data
        continue-on-error: true
        env:
          AGENT_FIRE_URL: ${{ secrets.AGENT_FIRE_URL }}
          AGENT_FIRE_TOKEN: ${{ secrets.AGENT_FIRE_TOKEN }}

      - name: Validate run ledger
        run: python -m intel.validate _agent_data/ledger

      - name: Commit and push
        if: always()
        working-directory: _agent_data
        run: |
          git config user.name "agent-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state 2>/dev/null || true
          git add archive 2>/dev/null || true
          git add ledger 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "scouts: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:agent-data; then break; fi
              echo "push rejected (attempt $i) -- rebasing and retrying"
              git pull --rebase origin agent-data
            done
          else
            echo "No state changes to commit."
          fi

      - name: Fail the job if the scout run failed
        if: steps.scout.outcome == 'failure'
        run: exit 1
