services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: market_agent_db
    restart: always
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: agent_password
      POSTGRES_DB: market_data
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d market_data"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
